<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titre_page }} - Administration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        body { background: #f4f1ec; }
        .admin-container { max-width: 900px; margin: 20px auto; padding: 24px; background: white;
                           border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.08); }
        .form-label { font-weight: 600; }
        .aide { color: #6c757d; font-size: .9rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('afficher_toutes_reservations') }}">Administration</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('afficher_toutes_reservations') }}">Réservations</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('reservations_par_date') }}">Par date</a></li>
                    <li class="nav-item"><a class="nav-link {% if page_active == 'ajouter' %}active{% endif %}" href="{{ url_for('ajouter_reservation_admin') }}"><i class="bi bi-telephone-plus"></i> Ajouter (téléphone)</a></li>
                    <li class="nav-item"><a class="nav-link {% if page_active == 'fermetures' %}active{% endif %}" href="{{ url_for('admin_fermetures') }}"><i class="bi bi-calendar-x"></i> Jours fermés</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_menu') }}">Menu</a></li>
                </ul>
                <div class="d-flex">
                    <a href="{{ url_for('accueil') }}" class="btn btn-outline-light me-2">Retour au site</a>
                    <a href="{{ url_for('admin_logout') }}" class="btn btn-outline-danger">Déconnexion</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="admin-container">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
                    </div>
                {% endfor %}
            {% endwith %}
